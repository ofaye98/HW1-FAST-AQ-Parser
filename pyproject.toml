[build-system]
requires = [
	"flit_core >=3.2,<4",
	"python_version >= '3.10'"
	]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[project]
name = "seqparser"
authors = [{name = "Faye Orcales", email = "faye.orcales@ucsf.edu"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: MIT License"]
dynamic = ["version", "description"]
requires-python = ">=3.10"
dependencies = [
    "pytest"
]

[project.urls]
Home = "https://github.com/ofaye98/HW1-FAST-AQ-Parser/tree/test/fast-aq-parser"